{% extends "core/_base.html" %}

{% block title %}Editar Perfil{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title text-center text-primary">Editar Perfil</h2>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_first_name" class="form-label">Primeiro Nome</label>
                            <input type="text" class="form-control" id="id_first_name" name="first_name" value="{{ perfil.usuario.first_name }}">
                        </div>
                        <div class="mb-3">
                            <label for="id_last_name" class="form-label">Último Nome</label>
                            <input type="text" class="form-control" id="id_last_name" name="last_name" value="{{ perfil.usuario.last_name }}">
                        </div>
                        <div class="mb-3">
                            <label for="id_email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="id_email" name="email" value="{{ perfil.usuario.email }}">
                        </div>
                        <div class="mb-3">
                            <label for="id_biografia" class="form-label">Biografia</label>
                            <textarea class="form-control" id="id_biografia" name="biografia" rows="3">{{ perfil.biografia }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="id_foto_perfil" class="form-label">Foto de Perfil</label>
                            {% if perfil.foto_perfil %}
                                <div class="mb-2">
                                    <img src="{{ perfil.foto_perfil.url }}" class="rounded-circle img-thumbnail" style="width: 100px; height: 100px; object-fit: cover;" alt="Foto Atual">
                                </div>
                            {% endif %}
                            <input type="file" class="form-control" id="id_foto_perfil" name="foto_perfil" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salvar Alterações</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'perfil' username=user.username %}" class="btn btn-outline-secondary">Voltar para o Perfil</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
